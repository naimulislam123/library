<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QALMORA - Digital Book Library</title>
    <!-- Google Fonts for Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PDF.js Library for Reading PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="theme-dark">

    <!-- Password Lock Screen -->
    <div id="lock-screen" class="splash-screen">
        <div class="splash-content">
            <div class="logo-icon">🔒</div>
            <h1>QALMORA</h1>
            <p>অ্যাপে প্রবেশ করতে পাসওয়ার্ড দিন</p>
            <input type="password" id="pass-input" placeholder="পাসওয়ার্ড লিখুন (1234)" class="pass-box">
            <button onclick="unlockApp()" class="btn-primary">Unlock</button>
            <p id="pass-error" class="error-msg">ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</p>
        </div>
    </div>

    <!-- Main App Content (Hidden until unlocked) -->
    <div id="app-content" style="display: none;">
        
        <!-- Navigation Bar -->
        <header class="navbar">
            <div class="logo">
                <span class="icon">📖</span> QALMORA
            </div>
            <div class="nav-right">
                <select id="theme-selector" class="theme-select">
                    <option value="theme-dark">Dark</option>
                    <option value="theme-light">Light</option>
                    <option value="theme-midnight">Midnight Blue</option>
                    <option value="theme-rosegold">Rose Gold</option>
                    <option value="theme-emerald">Emerald</option>
                </select>
            </div>
        </header>

        <!-- Main Body -->
        <main class="container">
            
            <!-- Hero Section & PDF Upload -->
            <section class="hero-section">
                <h2>Your Digital Library</h2>
                <div class="upload-box">
                    <p>📤 আপনার ফোন থেকে PDF বই আপলোড করে পড়ুন</p>
                    <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;" onchange="handlePDFUpload(event)">
                    <button onclick="document.getElementById('pdf-upload').click()" class="btn-upload">Choose PDF File</button>
                </div>
            </section>

            <!-- Book Shelf -->
            <section class="book-shelf">
                <h3>Sample Books</h3>
                <div class="books-grid">
                    <div class="book-card" onclick="openSampleReader('The Midnight Library', 'Matt Haig')">
                        <div class="book-cover cover-1">
                            <h4>The Midnight Library</h4>
                            <p>Matt Haig</p>
                        </div>
                        <div class="book-info">
                            <h4>The Midnight Library</h4>
                            <p class="author">Matt Haig</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Quick Notes & Bookmarks Section -->
            <section class="notes-section">
                <h3>📝 Quick Notes / Bookmarks</h3>
                <textarea id="note-input" placeholder="পড়ার সময় কোনো লাইন বা তথ্য নোট করে রাখুন..."></textarea>
                <button onclick="saveNote()" class="btn-primary">Save Note</button>
                <div id="saved-notes"></div>
            </section>

        </main>

        <!-- Reader View Modal -->
        <div id="reader-modal" class="reader-modal hidden">
            <div class="reader-header">
                <button onclick="closeReader()" class="back-btn">← Back</button>
                <h3 id="reader-title">Book Reader</h3>
            </div>
            <div class="reader-body">
                <canvas id="pdf-render"></canvas>
                <div id="text-content"></div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
                </html>
